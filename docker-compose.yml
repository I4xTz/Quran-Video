version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kurannuru
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d kurannuru"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: applies the Prisma migrations (User, drafts, tokens...) before
  # the backend starts. It must run first because `prisma migrate deploy`
  # refuses a non-empty database with no migration history, and the backend
  # creates its SQLAlchemy tables (surahs, ayahs) on startup. Never fails the
  # stack -- a warning is printed instead so video creation still works.
  migrate:
    build:
      context: ./frontend
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/kurannuru
    command: sh -c "npx prisma migrate deploy || echo 'WARNING - prisma migrate deploy failed, login and gallery features may not work'"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/kurannuru
      - CORS_ORIGINS=*
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    # Wipes disposable extraction/render scratch space on every container
    # start (audio clips, merge intermediates) so it can never accumulate
    # across restarts -- saved drafts and the size-capped surah_cache are
    # untouched since those are real user data / already self-limiting.
    command: sh -c "rm -rf /app/data/extracted_clips/* /app/data/temp_extraction/* /app/app/static/tmp/*/ 2>/dev/null; uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: on-failure

  frontend:
    build:
      context: ./frontend
    init: true # This is the magic fix! It kills zombie Chromium processes automatically
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/backend
      - INTERNAL_API_URL=http://backend:8000
      - WATCHPACK_POLLING=true # Ensure hot-reloading works on Windows/WSL
      - REMOTION_BROWSER_EXECUTABLE=/usr/bin/chromium
      - LANG=tr_TR.UTF-8
      - LC_ALL=tr_TR.UTF-8
      - NODE_OPTIONS=--max-old-space-size=2048 # Force Node to clean memory earlier
      - FREETYPE_PROPERTIES=cff:no-stem-darkening=1 autofitter:no-stem-darkening=1
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - DATABASE_URL=postgresql://user:password@db:5432/kurannuru
      - AUTH_SECRET=${AUTH_SECRET:-dev-only-insecure-secret-change-me} # Signs user session cookies -- set a real random value in your .env for anything beyond local dev
    shm_size: '2gb'
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 8G
    depends_on:
      - backend
      - db
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
      - render_assets:/app/public/render-assets
      - type: tmpfs
        target: /app/public/renders
        tmpfs:
          size: 512M
    # Wipes disposable trimmed-audio/generated-bg scratch space on every
    # container start so it can never accumulate across restarts -- saved
    # drafts (render-assets/drafts, src/data/drafts) are untouched since
    # those are real in-progress projects, not disposable output.
    command: sh -c "rm -rf public/render-assets/trimmed-audio/* public/render-assets/generated-bg/* 2>/dev/null; npm run dev"
    restart: on-failure

volumes:
  postgres_data:
  render_assets:
